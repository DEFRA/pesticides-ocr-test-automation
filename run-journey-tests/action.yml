name: Run Journey Tests on GitHub

inputs:
  example-node-backend:
    required: false
    type: string
  example-node-frontend:
    required: false
    type: string

runs:
  using: "composite"
  steps:
    - name: Docker Login
      uses: DEFRA/cdp-build-action/docker-login@main

    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Setup the tests
      run: npm ci
      shell: bash
    - name: Install Playwright browsers
      run: npx playwright install --with-deps chromium
      shell: bash
    - name: Start docker compose
      shell: bash
      run: |
          CDP_EXAMPLE_NODE_FRONTEND=${{inputs.example-node-frontend}} \
          CDP_EXAMPLE_NODE_BACKEND=${{inputs.example-node-backend}} \
          docker compose up --wait-timeout 300 -d --quiet-pull
    - name: Run the tests
      shell: bash
      env:
        BASE_URL: http://localhost:3000
        CI: true
      run: npm run test:chromium
    - name: Generate allure report
      if: always()
      run: npm run report
      shell: bash
    - name: debug
      if: always()
      run: |
        docker compose logs > logs.txt
        docker ps
      shell: bash
    - name: Upload allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
    - name: Upload Playwright traces
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-test-results
        path: ./test-results
    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: ./logs.txt
